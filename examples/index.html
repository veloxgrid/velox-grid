<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeloxGrid - Basic Example</title>
  <link rel="stylesheet" href="../dist/velox-grid.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; color: #333; }
    .description { margin-bottom: 20px; color: #666; }
    .toolbar {
      margin-bottom: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar button {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .toolbar button:hover {
      background: #e3f2fd;
      border-color: #1976d2;
    }
    #grid-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .info h3 { margin-bottom: 10px; color: #333; }
    .info pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🚀 VeloxGrid - Basic Example</h1>
  <p class="description">A fast, lightweight, and framework-agnostic data grid</p>
  
  <div class="toolbar">
    <button onclick="addRow()">➕ 행 추가</button>
    <button onclick="removeSelectedRows()">🗑️ 선택 행 삭제</button>
    <button onclick="selectAll()">☑️ 전체 선택</button>
    <button onclick="clearSelection()">⬜ 선택 해제</button>
    <button onclick="sortByName()">🔤 이름 정렬</button>
    <button onclick="sortByAge()">🔢 나이 정렬</button>
    <button onclick="clearSort()">🔄 정렬 초기화</button>
    <button onclick="filterAdults()">👤 성인만 보기</button>
    <button onclick="clearFilter()">🔍 필터 해제</button>
    <button onclick="logData()">📋 데이터 출력</button>
  </div>
  
  <div id="grid-container"></div>
  
  <div class="info">
    <h3>📊 그리드 정보</h3>
    <pre id="grid-info">선택된 행: 0개</pre>
  </div>

  <script src="../dist/velox-grid.iife.js"></script>
  <script>
    // Sample data
    const sampleData = [
      { id: 1, name: '김철수', age: 28, email: 'kim@example.com', department: '개발팀', salary: 5000000 },
      { id: 2, name: '이영희', age: 32, email: 'lee@example.com', department: '디자인팀', salary: 4500000 },
      { id: 3, name: '박민수', age: 25, email: 'park@example.com', department: '개발팀', salary: 4000000 },
      { id: 4, name: '최지연', age: 35, email: 'choi@example.com', department: '기획팀', salary: 5500000 },
      { id: 5, name: '정수빈', age: 29, email: 'jung@example.com', department: '마케팅팀', salary: 4800000 },
      { id: 6, name: '강민호', age: 41, email: 'kang@example.com', department: '개발팀', salary: 7000000 },
      { id: 7, name: '윤서연', age: 27, email: 'yoon@example.com', department: '디자인팀', salary: 4200000 },
      { id: 8, name: '임재현', age: 33, email: 'lim@example.com', department: '기획팀', salary: 5200000 },
      { id: 9, name: '한소희', age: 24, email: 'han@example.com', department: '마케팅팀', salary: 3800000 },
      { id: 10, name: '오준혁', age: 38, email: 'oh@example.com', department: '개발팀', salary: 6500000 },
    ];

    // Column definitions
    const columns = [
      { field: 'id', header: 'ID', type: 'number', width: 60, align: 'center', sortable: true },
      { field: 'name', header: '이름', type: 'text', width: 120, sortable: true, editable: true },
      { field: 'age', header: '나이', type: 'number', width: 80, align: 'center', sortable: true, editable: true },
      { field: 'email', header: '이메일', type: 'text', width: 200, sortable: true, editable: true },
      { field: 'department', header: '부서', type: 'text', width: 120, sortable: true, editable: true },
      { 
        field: 'salary', 
        header: '급여', 
        type: 'number', 
        width: 130, 
        align: 'right',
        sortable: true,
        formatter: (value) => value ? `₩${value.toLocaleString()}` : ''
      },
    ];

    // Create grid instance
    const grid = new VeloxGrid.VeloxGrid('#grid-container', {
      columns,
      data: sampleData,
      height: 400,
      showCheckbox: true,
      showRowNumbers: true,
      selectable: true,
      selectionMode: 'multiple',
      sortable: true,
      editable: true,
      resizable: true,
      emptyMessage: '데이터가 없습니다.',
    }, {
      onSelectionChange: (selectedRows) => {
        updateInfo(`선택된 행: ${selectedRows.length}개`);
      },
      onSort: (sortState) => {
        if (sortState.length > 0) {
          console.log('Sort:', sortState[0].field, sortState[0].direction);
        }
      },
      onCellEditEnd: (event) => {
        console.log('Edit:', event.field, event.oldValue, '→', event.newValue);
      },
      onReady: (instance) => {
        console.log('VeloxGrid is ready!', instance);
      }
    });

    // Toolbar functions (global scope for onclick)
    function addRow() {
      const newId = grid.getRowCount() + 1;
      grid.addRow({
        id: newId,
        name: '새 직원',
        age: 30,
        email: `new${newId}@example.com`,
        department: '미정',
        salary: 4000000
      });
    }

    function removeSelectedRows() {
      const selected = grid.getSelectedRows();
      console.log('Selected rows to remove:', selected);
      [...selected].sort((a, b) => b - a).forEach(index => grid.removeRow(index));
    }

    function selectAll() {
      grid.selectAll(true);
    }

    function clearSelection() {
      grid.clearSelection();
    }

    function sortByName() {
      const currentSort = grid.getSortState();
      const nameSort = currentSort.find(s => s.field === 'name');
      const newDirection = nameSort?.direction === 'asc' ? 'desc' : 'asc';
      grid.sort('name', newDirection);
    }

    function sortByAge() {
      const currentSort = grid.getSortState();
      const ageSort = currentSort.find(s => s.field === 'age');
      const newDirection = ageSort?.direction === 'asc' ? 'desc' : 'asc';
      grid.sort('age', newDirection);
    }

    function clearSort() {
      grid.clearSort();
    }

    function filterAdults() {
      grid.filter({ field: 'age', operator: 'greaterThanOrEqual', value: 30 });
    }

    function clearFilter() {
      grid.clearFilter();
    }

    function logData() {
      console.log('All Data:', grid.getData());
      console.log('Selected Data:', grid.getSelectedData());
    }

    function updateInfo(text) {
      document.getElementById('grid-info').textContent = text;
    }
  </script>
</body>
</html>
